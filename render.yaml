services:
  - type: web
    name: rickshaw-share-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: rickshaw-share-db
          property: connectionString

databases:
  - name: rickshaw-share-db
    plan: free
